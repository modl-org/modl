name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cross-compilation deps for Linux ARM
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # musl tools for static Linux build
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      # Package — Unix
      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p staging/python
          cp target/${{ matrix.target }}/release/modl staging/
          rsync -a --exclude='__pycache__' python/modl_worker/ staging/python/modl_worker/
          cd staging
          tar czf ../modl-${{ github.ref_name }}-${{ matrix.target }}.tar.gz modl python/
          cd ..

      # Package — Windows
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/python
          Copy-Item "target/${{ matrix.target }}/release/modl.exe" staging/
          Copy-Item -Recurse python/modl_worker staging/python/modl_worker
          Compress-Archive -Path "staging/*" -DestinationPath "modl-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modl-${{ matrix.target }}
          path: modl-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum modl-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/modl-*
            artifacts/SHA256SUMS

  # The secrets context is not available in job-level `if` expressions;
  # referencing it there fails the whole workflow at parse time (the 0-second
  # startup failures that shipped v0.2.13/v0.2.14 with no assets). Gate via a
  # job output instead, where secrets are legal.
  docker-gate:
    name: Check Docker Hub credentials
    runs-on: ubuntu-latest
    outputs:
      has-creds: ${{ steps.check.outputs.has-creds }}
    steps:
      - id: check
        run: echo "has-creds=${{ secrets.DOCKERHUB_USERNAME != '' }}" >> "$GITHUB_OUTPUT"

  docker:
    name: Push GPU Docker Image
    needs: [build, docker-gate]
    runs-on: ubuntu-latest
    if: needs.docker-gate.outputs.has-creds == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: modl-x86_64-unknown-linux-gnu
          path: artifacts

      - name: Extract binary
        run: |
          mkdir -p target/x86_64-unknown-linux-gnu/release
          tar xzf artifacts/modl-*.tar.gz -C target/x86_64-unknown-linux-gnu/release/

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gpu
          push: true
          tags: |
            modlorg/modl-gpu:latest
            modlorg/modl-gpu:${{ github.ref_name }}

  trigger-site-rebuild:
    name: Trigger Site Rebuild
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        continue-on-error: true
        run: curl -s -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"

  # Publish to crates.io (manual trigger only — uncomment when ready)
  # publish:
  #   name: Publish to crates.io
  #   needs: release
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - run: cargo publish
  #       env:
  #         CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
